<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GiJos Chat</title>

  <style>
    /* RESET */
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, rgba(147,51,234,0.12) 0%, rgba(0,0,0,0) 60%),
                  radial-gradient(circle at 80% 30%, rgba(16,185,129,0.08) 0%, rgba(0,0,0,0) 60%),
                  #0a0a0f;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* floating glow blobs (background accent) */
    .bg-glow {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, rgba(168,85,247,0.6) 0%, rgba(0,0,0,0) 70%);
      filter: blur(60px);
      opacity: 0.3;
      animation: pulseGlow 6s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }
    .bg-glow.alt {
      background: radial-gradient(circle at 70% 30%, rgba(16,185,129,0.6) 0%, rgba(0,0,0,0) 70%);
      width: 240px;
      height: 240px;
      animation-delay: 3s;
      mix-blend-mode: screen;
    }

    @keyframes pulseGlow {
      0%,100% { transform: translateY(-10px) scale(1); opacity: 0.3; }
      50%     { transform: translateY(10px)  scale(1.05); opacity: 0.5; }
    }

    /* CHAT WRAPPER CARD */
    .chat-wrapper {
      background-color: #0f172a;
      width: 100%;
      max-width: 420px;
      height: 80vh;
      max-height: 90vh;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow:
        0 30px 80px rgba(0,0,0,0.9),
        0 0 60px rgba(168,85,247,0.25),
        0 0 120px rgba(16,185,129,0.15);
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.2);
      position: relative;
      z-index: 1;
    }

    /* HEADER */
    .chat-header {
      background: linear-gradient(
        90deg,
        rgba(168, 85, 247, 0.25) 0%,
        rgba(16, 185, 129, 0.15) 100%
      );
      border-bottom: 1px solid rgba(168,85,247,0.35);
      padding: 16px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .brand-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px;
    }

    .shop-name {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow:
        0 0 8px rgba(168,85,247,0.8),
        0 0 16px rgba(16,185,129,0.4);
    }

    .shop-pill {
      font-size: 11px;
      font-weight: 400;
      color: #a7ffdc;
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.5);
      padding: 2px 6px;
      border-radius: 999px;
      line-height: 1.3;
      box-shadow: 0 0 8px rgba(16,185,129,0.8);
      text-shadow: 0 0 8px rgba(16,185,129,0.8);
      white-space: nowrap;
    }

    .status-pill {
      font-size: 11px;
      background: rgba(16,185,129,0.15);
      border: 1px solid rgba(16,185,129,0.5);
      color: #a7ffdc;
      padding: 2px 8px;
      line-height: 1.4;
      border-radius: 999px;
      text-shadow: 0 0 8px rgba(16,185,129,0.8);
      white-space: nowrap;
    }

    .subline {
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.4;
      color: #c084fc;
      font-weight: 400;
      text-shadow: 0 0 8px rgba(168,85,247,0.65);
    }

    .subline small {
      color: #9ca3af;
      font-size: 11px;
      font-weight: 400;
      display: block;
      text-shadow: none;
    }

    /* MESSAGES AREA */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background:
        radial-gradient(circle at 20% 0%, rgba(168,85,247,0.07) 0%, rgba(0,0,0,0) 70%),
        radial-gradient(circle at 80% 20%, rgba(16,185,129,0.05) 0%, rgba(0,0,0,0) 70%),
        rgba(0,0,0,0);
      scrollbar-width: thin;
      scrollbar-color: rgba(168,85,247,0.4) rgba(0,0,0,0);
      display: flex;
      flex-direction: column;
      -webkit-overflow-scrolling: touch;
    }

    .chat-messages::-webkit-scrollbar {
      width: 4px;
    }
    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background-color: rgba(168,85,247,0.4);
      border-radius: 999px;
    }

    /* ROWS + BUBBLES */
    .bubble-row {
      display: flex;
      margin-bottom: 14px;
      width: 100%;
    }
    .from-bot {
      justify-content: flex-start;
    }
    .from-user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 80%;
      font-size: 14px;
      line-height: 1.45;
      border-radius: 14px;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
      border: 1px solid transparent;
    }

    .bubble.bot {
      background: rgba(31,41,55,0.6);
      border: 1px solid rgba(168,85,247,0.4);
      border-bottom-left-radius: 4px;
      color: #fff;
      box-shadow:
        0 20px 40px rgba(0,0,0,0.8),
        0 0 12px rgba(168,85,247,0.6),
        0 0 48px rgba(16,185,129,0.3);
      backdrop-filter: blur(12px);
    }

    .bubble.user {
      background: radial-gradient(circle at 0% 0%, rgba(168,85,247,0.5) 0%, rgba(17,24,39,0.6) 60%);
      border: 1px solid rgba(168,85,247,0.6);
      border-bottom-right-radius: 4px;
      color: #fff;
      text-shadow: 0 0 6px rgba(168,85,247,0.8);
      box-shadow:
        0 20px 40px rgba(0,0,0,0.9),
        0 0 16px rgba(168,85,247,0.8),
        0 0 64px rgba(16,185,129,0.3);
      backdrop-filter: blur(10px);
    }

    .typing-bubble {
      width: auto;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #fff;
      opacity: 0.6;
      box-shadow: 0 0 8px rgba(255,255,255,0.9);
      animation: blink 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%,100% { opacity: 0.2; transform: translateY(0px); }
      50%     { opacity: 1;   transform: translateY(-2px); }
    }

    /* INPUT AREA */
    .chat-input-area {
      padding: 12px;
      background: rgba(0,0,0,0.4);
      border-top: 1px solid rgba(168,85,247,0.3);
      display: flex;
      gap: 8px;
      align-items: center;
      backdrop-filter: blur(10px);
      box-shadow:
        0 -20px 40px rgba(0,0,0,0.9),
        0 0 24px rgba(168,85,247,0.4),
        0 0 60px rgba(16,185,129,0.2);
    }

    .chat-input-area input {
      flex: 1;
      background: rgba(17,24,39,0.7);
      border: 1px solid rgba(168,85,247,0.4);
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      line-height: 1.4;
      color: #fff;
      outline: none;
      box-shadow: 0 0 20px rgba(168,85,247,0.4);
    }
    .chat-input-area input::placeholder {
      color: #9ca3af;
      opacity: 0.6;
    }

    .chat-input-area button {
      background: radial-gradient(circle at 0% 0%, rgba(16,185,129,0.6) 0%, rgba(0,0,0,0.6) 70%);
      border: 1px solid rgba(16,185,129,0.6);
      color: #ecfdf5;
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      padding: 12px 14px;
      line-height: 1.2;
      cursor: pointer;
      box-shadow:
        0 10px 30px rgba(0,0,0,0.9),
        0 0 16px rgba(16,185,129,0.8),
        0 0 40px rgba(168,85,247,0.4);
      text-shadow:
        0 0 8px rgba(16,185,129,0.8),
        0 0 16px rgba(16,185,129,0.5);
    }
    .chat-input-area button:active {
      transform: scale(0.97);
    }

    /* FOOTER HINT */
    .footer-hint {
      margin-top: 16px;
      max-width: 420px;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
      color: #6b7280;
      z-index: 1;
    }
    .footer-hint b {
      color: #fff;
      font-weight: 500;
    }
    .footer-hint .addr {
      color: #a7ffdc;
      text-shadow: 0 0 8px rgba(16,185,129,0.8);
      font-weight: 500;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .chat-wrapper {
        max-width: 100%;
        width: 100%;
        height: 90vh;
        max-height: 90vh;
        border-radius: 12px;
        box-shadow:
          0 20px 50px rgba(0,0,0,0.8),
          0 0 40px rgba(168,85,247,0.2),
          0 0 80px rgba(16,185,129,0.1);
      }

      .chat-header {
        font-size: 14px;
        padding: 12px 14px;
      }

      .shop-name {
        font-size: 14px;
      }

      .status-pill {
        font-size: 10px;
        padding: 2px 6px;
      }

      .subline {
        font-size: 11px;
      }
      .subline small {
        font-size: 10px;
      }

      .chat-messages {
        padding: 12px;
        font-size: 14px;
      }

      .bubble {
        font-size: 14px;
        line-height: 1.4;
        padding: 10px 12px;
        max-width: 80%;
      }

      .chat-input-area {
        padding: 10px;
        gap: 8px;
      }

      .chat-input-area input {
        font-size: 14px;
        padding: 11px 12px;
      }

      .chat-input-area button {
        font-size: 14px;
        padding: 11px 14px;
      }

      .footer-hint {
        font-size: 11px;
        line-height: 1.4;
        max-width: 360px;
      }
    }
  </style>
</head>
<body>

  <!-- floating glow blobs -->
  <div class="bg-glow" style="top: 40px; left: 8%;"></div>
  <div class="bg-glow alt" style="bottom: 40px; right: 10%;"></div>

  <div class="chat-wrapper">
    <div class="chat-header">
      <div class="brand-row">
        <div class="shop-name">
          <span>GiJos</span>
          <span class="shop-pill">Afhalen</span>
        </div>

        <div class="status-pill">
          13u–18u · elke dag
        </div>
      </div>

      <div class="subline">
        Bromidestraat 32 · Tourtonne 5 · Paramaribo
        <small>We zijn een afhaallocatie. Eerst bestellen, dan ophalen.</small>
      </div>
    </div>

    <div id="chat" class="chat-messages">
      <!-- chat bubbles get injected here -->
    </div>

    <div class="chat-input-area">
      <input
        id="user-input"
        type="text"
        placeholder="Typ hier... (bijv. 'heb je slakkengel nog?')"
      />
      <button id="send-btn">Verstuur</button>
    </div>
  </div>

  <div class="footer-hint">
    Dit is een test chat met onze assistent van <b>GiJos</b>.<br/>
    Afhalen: <span class="addr">Bromidestraat 32 Tourtonne 5 Paramaribo</span>.<br/>
    Contant betalen in SRD 💸
  </div>

  <script>
    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    // simpele session id per browser
    let conversationId = "browser-user-" + Math.floor(Math.random() * 999999);

    function addBubble(text, sender) {
      const row = document.createElement("div");
      row.className = "bubble-row " + (sender === "bot" ? "from-bot" : "from-user");

      const bubble = document.createElement("div");
      bubble.className = "bubble " + (sender === "bot" ? "bot" : "user");
      bubble.textContent = text;

      row.appendChild(bubble);
      chatEl.appendChild(row);

      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function addTypingBubble() {
      const row = document.createElement("div");
      row.className = "bubble-row from-bot typing-row";

      const bubble = document.createElement("div");
      bubble.className = "bubble bot";

      const wrap = document.createElement("div");
      wrap.className = "typing-bubble";

      for (let i = 0; i < 3; i++) {
        const dot = document.createElement("div");
        dot.className = "dot";
        wrap.appendChild(dot);
      }
      bubble.appendChild(wrap);
      row.appendChild(bubble);
      chatEl.appendChild(row);

      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function removeTypingBubble() {
      const typingRow = document.querySelector(".typing-row");
      if (typingRow) typingRow.remove();
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      // toon mijn bericht
      addBubble(text, "user");

      // leeg input
      inputEl.value = "";

      // toon "..." bot is aan het typen
      addTypingBubble();

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            from: conversationId,
            text: text,
          }),
        });

        const data = await res.json();
        removeTypingBubble();

        if (data && data.reply) {
          addBubble(data.reply, "bot");
        } else {
          addBubble("⚠ Ik kreeg geen antwoord terug van de server.", "bot");
        }
      } catch (err) {
        console.error(err);
        removeTypingBubble();
        addBubble("⚠ Verbinding lukt even niet.", "bot");
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        sendMessage();
      }
    });

    // eerste automatische begroeting
    addBubble(
      "Hey lief hoe gaat het 🫶 Wat wil je hebben en hoeveel stuks? Dan check ik direct of het er is voor je.",
      "bot"
    );
  </script>
</body>
</html>
